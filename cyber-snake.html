<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CYBER SNAKE</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;overflow:hidden;font-family:'Courier New',monospace}
canvas{display:block;border:2px solid #0f0;box-shadow:0 0 30px #0f0,0 0 60px #080}
</style>
</head>
<body>
<canvas id="game"></canvas>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const W=600,H=600,CELL=20,COLS=W/CELL,ROWS=H/CELL;
canvas.width=W;canvas.height=H;

let audioCtx=null;
function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)()}
function tone(f,d,t,v){if(!audioCtx)return;const o=audioCtx.createOscillator(),g=audioCtx.createGain();o.connect(g);g.connect(audioCtx.destination);o.type=t||'square';o.frequency.setValueAtTime(f,audioCtx.currentTime);g.gain.setValueAtTime(v||.1,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+d);o.start();o.stop(audioCtx.currentTime+d)}

let state='menu',score=0,highScore=parseInt(localStorage.getItem('cyberSnakeHS'))||0;
let snake=[],dir={x:1,y:0},nextDir={x:1,y:0},food=null,particles=[];
let gameTime=0,moveTimer=0,moveRate=8,powerups=[],effects=[];
let foodType='normal'; // normal, speed, mega, slow

const FOOD_TYPES=[
  {type:'normal',color:'#0f0',points:10,chance:0.6},
  {type:'speed',color:'#ff0',points:25,chance:0.15},
  {type:'mega',color:'#f0f',points:50,chance:0.1},
  {type:'slow',color:'#0ff',points:15,chance:0.15}
];

document.addEventListener('keydown',e=>{
  if(state==='menu'&&(e.code==='Enter'||e.code==='Space')){initAudio();startGame()}
  if(state==='dead'&&(e.code==='Enter'||e.code==='Space'))startGame();
  if(state==='playing'){
    if((e.code==='ArrowUp'||e.code==='KeyW')&&dir.y!==1)nextDir={x:0,y:-1};
    if((e.code==='ArrowDown'||e.code==='KeyS')&&dir.y!==-1)nextDir={x:0,y:1};
    if((e.code==='ArrowLeft'||e.code==='KeyA')&&dir.x!==1)nextDir={x:-1,y:0};
    if((e.code==='ArrowRight'||e.code==='KeyD')&&dir.x!==-1)nextDir={x:1,y:0};
  }
  if(e.code==='Space'||e.code==='ArrowUp'||e.code==='ArrowDown')e.preventDefault();
});

class Particle{
  constructor(x,y,vx,vy,color,life,size){this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;this.life=life;this.maxLife=life;this.size=size||3}
  update(){this.x+=this.vx;this.y+=this.vy;this.life--;this.vx*=.95;this.vy*=.95}
  draw(){const a=this.life/this.maxLife;ctx.globalAlpha=a;ctx.fillStyle=this.color;ctx.fillRect(this.x-this.size/2,this.y-this.size/2,this.size*a,this.size*a);ctx.globalAlpha=1}
}
function burst(x,y,color,count){for(let i=0;i<count;i++){const a=Math.random()*Math.PI*2,s=Math.random()*4+1;particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s,color,20+Math.random()*10,2+Math.random()*3))}}

function spawnFood(){
  let pos;
  do{pos={x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)}}
  while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
  const r=Math.random();let cum=0;
  let type=FOOD_TYPES[0];
  for(const ft of FOOD_TYPES){cum+=ft.chance;if(r<cum){type=ft;break}}
  food={x:pos.x,y:pos.y,...type,time:0};
}

function startGame(){
  state='playing';score=0;gameTime=0;moveTimer=0;moveRate=8;particles=[];effects=[];
  snake=[{x:5,y:Math.floor(ROWS/2)},{x:4,y:Math.floor(ROWS/2)},{x:3,y:Math.floor(ROWS/2)}];
  dir={x:1,y:0};nextDir={x:1,y:0};
  spawnFood();
}

function update(){
  if(state!=='playing')return;
  gameTime++;
  moveTimer++;
  if(moveTimer<moveRate)return;
  moveTimer=0;
  dir=nextDir;
  const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  // Wall collision (wrap)
  if(head.x<0)head.x=COLS-1;if(head.x>=COLS)head.x=0;
  if(head.y<0)head.y=ROWS-1;if(head.y>=ROWS)head.y=0;
  // Self collision
  if(snake.some(s=>s.x===head.x&&s.y===head.y)){
    state='dead';
    tone(100,.5,'sawtooth',.3);
    burst(head.x*CELL+CELL/2,head.y*CELL+CELL/2,'#f00',30);
    if(score>highScore){highScore=score;localStorage.setItem('cyberSnakeHS',highScore)}
    return;
  }
  snake.unshift(head);
  // Food collision
  if(food&&head.x===food.x&&head.y===food.y){
    score+=food.points;
    tone(600,.1,'sine',.2);tone(900,.15,'sine',.15);
    burst(food.x*CELL+CELL/2,food.y*CELL+CELL/2,food.color,15);
    effects.push({text:`+${food.points}`,x:food.x*CELL,y:food.y*CELL,life:40,color:food.color});
    if(food.type==='speed')moveRate=Math.max(3,moveRate-1);
    if(food.type==='slow')moveRate=Math.min(12,moveRate+1);
    if(food.type==='mega'){snake.unshift({...snake[0]});snake.unshift({...snake[0]})}
    spawnFood();
    // Speed up gradually
    if(score%100===0&&moveRate>4)moveRate--;
  }else{snake.pop()}
  // Update particles & effects
  particles.forEach(p=>p.update());
  particles=particles.filter(p=>p.life>0);
  effects.forEach(e=>{e.life--;e.y-=0.5});
  effects=effects.filter(e=>e.life>0);
  if(food)food.time++;
}

function draw(){
  // Background
  ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  // Grid
  ctx.strokeStyle='rgba(0,255,0,0.05)';ctx.lineWidth=1;
  for(let x=0;x<W;x+=CELL){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
  for(let y=0;y<H;y+=CELL){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}

  if(state==='menu'){drawMenu();return}

  // Snake
  for(let i=0;i<snake.length;i++){
    const s=snake[i],a=1-i/snake.length*0.5;
    const hue=120+i*2;
    ctx.fillStyle=i===0?'#fff':`hsl(${hue},100%,${50*a}%)`;
    ctx.shadowColor=i===0?'#0f0':`hsl(${hue},100%,50%)`;
    ctx.shadowBlur=i===0?15:8;
    ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2);
    ctx.shadowBlur=0;
  }
  // Eyes on head
  const h=snake[0];
  ctx.fillStyle='#000';
  if(dir.x===1){ctx.fillRect(h.x*CELL+13,h.y*CELL+5,4,4);ctx.fillRect(h.x*CELL+13,h.y*CELL+11,4,4)}
  else if(dir.x===-1){ctx.fillRect(h.x*CELL+3,h.y*CELL+5,4,4);ctx.fillRect(h.x*CELL+3,h.y*CELL+11,4,4)}
  else if(dir.y===-1){ctx.fillRect(h.x*CELL+5,h.y*CELL+3,4,4);ctx.fillRect(h.x*CELL+11,h.y*CELL+3,4,4)}
  else{ctx.fillRect(h.x*CELL+5,h.y*CELL+13,4,4);ctx.fillRect(h.x*CELL+11,h.y*CELL+13,4,4)}

  // Food
  if(food){
    const pulse=Math.sin(food.time*.15)*.3+.7;
    ctx.fillStyle=food.color;ctx.shadowColor=food.color;ctx.shadowBlur=15*pulse;
    ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,CELL/2*pulse,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
    // Label
    ctx.fillStyle='#000';ctx.font='bold 9px Courier New';ctx.textAlign='center';ctx.textBaseline='middle';
    const labels={normal:'',speed:'F',mega:'M',slow:'S'};
    if(labels[food.type])ctx.fillText(labels[food.type],food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
  }
  // Particles
  particles.forEach(p=>p.draw());
  // Score effects
  effects.forEach(e=>{ctx.globalAlpha=e.life/40;ctx.fillStyle=e.color;ctx.font='bold 14px Courier New';ctx.textAlign='center';ctx.fillText(e.text,e.x+CELL/2,e.y);ctx.globalAlpha=1});
  // HUD
  ctx.fillStyle='#0f0';ctx.font='bold 18px Courier New';ctx.textAlign='left';ctx.fillText(`SCORE: ${score}`,10,25);
  ctx.textAlign='right';ctx.fillStyle='#555';ctx.font='12px Courier New';ctx.fillText(`HI: ${highScore}`,W-10,25);
  ctx.fillStyle='#0f0';ctx.font='12px Courier New';ctx.textAlign='left';ctx.fillText(`LEN: ${snake.length}`,10,H-10);

  if(state==='dead'){
    ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(0,0,W,H);
    ctx.fillStyle='#f44';ctx.font='bold 44px Courier New';ctx.textAlign='center';ctx.shadowColor='#f00';ctx.shadowBlur=20;
    ctx.fillText('GAME OVER',W/2,H/3);ctx.shadowBlur=0;
    ctx.fillStyle='#fff';ctx.font='22px Courier New';ctx.fillText(`Score: ${score}`,W/2,H/2);
    ctx.fillText(`Length: ${snake.length}`,W/2,H/2+30);
    if(score>=highScore&&score>0){ctx.fillStyle='#ff0';ctx.font='bold 18px Courier New';ctx.fillText('NEW HIGH SCORE!',W/2,H/2+70)}
    ctx.fillStyle='#aaa';ctx.font='16px Courier New';ctx.fillText('ENTER/SPACE to Retry',W/2,H/2+120);
  }
}

function drawMenu(){
  const g=Math.sin(gameTime*.05)*.3+.7;
  ctx.shadowColor='#0f0';ctx.shadowBlur=20*g;ctx.fillStyle='#0f0';ctx.font='bold 52px Courier New';ctx.textAlign='center';
  ctx.fillText('CYBER',W/2,H/3-10);ctx.fillStyle='#0ff';ctx.shadowColor='#0ff';ctx.fillText('SNAKE',W/2,H/3+50);ctx.shadowBlur=0;
  ctx.fillStyle='#fff';ctx.font='18px Courier New';ctx.fillText('Press ENTER or SPACE',W/2,H/2+40);
  ctx.fillStyle='#888';ctx.font='14px Courier New';
  ctx.fillText('WASD / Arrow Keys to move',W/2,H/2+80);
  ctx.fillText('Eat food, grow long, don\'t hit yourself!',W/2,H/2+105);
  ctx.fillStyle='#ff0';ctx.fillText(`High Score: ${highScore}`,W/2,H/2+145);
  // Food legend
  ctx.font='12px Courier New';ctx.fillStyle='#0f0';ctx.fillText('Green=Normal  Yellow=Speed  Pink=Mega  Cyan=Slow',W/2,H/2+175);
  gameTime++;
}

function loop(){update();draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
</body>
</html>
